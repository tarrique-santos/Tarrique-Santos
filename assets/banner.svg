<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Tarrique Santos - Developer</title>
<desc id="desc">Dark futuristic developer banner with neon green circuitry and a sci-fi interface.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#030807"/><stop offset=".55" stop-color="#06120e"/><stop offset="1" stop-color="#020504"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00e676"/><stop offset="1" stop-color="#7cffb2"/>
